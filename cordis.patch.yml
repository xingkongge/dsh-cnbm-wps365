# cnbm知识库（WPS 365）：包一层官方 wps365-cli。
#
# 凭证与 token 全部由 CLI 自己持有（系统钥匙串），本插件不读取、不记录。
# 可覆盖的 config 字段：
#   cliPath       CLI 可执行文件路径；留空则按 WPS365_CLI → ~/.local/bin → PATH 探测
#   configDir     CLI 配置目录；留空则用 CLI 自身默认位置（推荐）
#   timeoutMs     单次 CLI 调用超时，默认 30000
#   maxOutputChars 工具结果最大字符数，默认 20000
#   readOnly      是否禁止写类命令，默认 true
#   allowWrite    显式放开写类命令，默认 false（readOnly 为 true 时不生效）
#   loginTimeoutMs 设备码登录等待上限，默认 300000
#   autoRelogin   授权失效时自动拉起设备码登录，默认 true（v2.1 新增）
#   loginScopes   自动重登申请的 scope（逗号分隔）；留空=沿用已授予 scope
- insert:
    - id: cnbm-knowledge
      name: '@cnbm/dsh-wps365'
      config: {}
